<figure class="window shot" data-reveal>
          <div class="window-bar">
            <span class="window-tab">{{file}}</span>
            <span class="window-meta">{{slug}}</span>
          </div>
          <img class="window-body" src="/{{img.src}}" alt="{{img.alt}}"{{#if width}} width="{{width}}" height="{{height}}"{{/if}} loading="lazy" decoding="async" />
        </figure>
